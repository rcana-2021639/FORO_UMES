# Backend (Strapi) en Render, plan gratuito (DESPLIEGUE.md §8). Render lee este archivo al crear un
# "Blueprint" desde el repositorio. Las claves secretas se generan solas (generateValue); lo que
# dice `sync: false` se pega a mano en el panel de Render la primera vez.
services:
  - type: web
    name: foro-posgrado-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 512 MB en el plan gratuito: el montón de Node con tope y libvips (fotos) en un solo hilo
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: VIPS_CONCURRENCY
        value: '1'
      - key: TRUST_PROXY
        value: 'true'
      - key: PROXY_IP_HEADER
        value: X-Forwarded-For
      - key: PROXY_MAX_IPS
        value: '1'

      # Claves de Strapi: Render las genera una vez y no cambian entre despliegues
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Primer Super Admin (se crea al arrancar si no hay ninguno; DESPLIEGUE.md §8.5).
      # Después de entrar por primera vez, borrar SUPERADMIN_PASSWORD aquí.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_FIRSTNAME
        sync: false
      - key: SUPERADMIN_LASTNAME
        sync: false
      # El mismo valor va en Vercel (FRONTEND_API_TOKEN del frontend)
      - key: FRONTEND_API_TOKEN
        generateValue: true

      # Base de datos: Supabase (Session pooler, IPv4). Pool pequeño: el plan gratuito limita conexiones
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: '5432'
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: DATABASE_POOL_MIN
        value: '0'
      - key: DATABASE_POOL_MAX
        value: '5'

      # Fotos: Cloudinary (el disco de Render gratis se borra en cada despliegue)
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: foro-posgrado

      # Direcciones: la de este servicio y la del sitio en Vercel (CORS)
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Correo (Brevo, gratis): avisos del formulario de contacto y "olvidé mi contraseña"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: CONTACT_RETENTION_DAYS
        value: '365'
