# Actualizaciones automáticas de dependencias con vulnerabilidades (Sprint 5, tarea 8)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: jonathan
    open-pull-requests-limit: 5
    groups:
      strapi:
        patterns: ['@strapi/*']
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: jonathan
