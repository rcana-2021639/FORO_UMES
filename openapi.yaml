  /contact:
    post:
      tags:
        - Contact
      summary: Enviar un mensaje desde el formulario de contacto
      description: "Público. Incluye un campo trampa (honeypot) `website` que debe enviarse VACÍO u omitirse; si viene relleno la solicitud se descarta silenciosamente. Límite de tasa: 5 envíos por hora por IP."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - message
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 200
                email:
                  type: string
                  format: email
                  maxLength: 255
                subject:
                  type: string
                  maxLength: 250
                message:
                  type: string
                  minLength: 10
                  maxLength: 2000
                website:
                  type: string
                  description: Honeypot. Dejar vacío.
                  example: ""
      responses:
        "201":
          description: Mensaje recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      received:
                        type: boolean
                      message:
                        type: string
        "400":
          description: Campos inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: object
                    required:
                      - status
                      - code
                      - message
        "429":
          description: Demasiados envíos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: object
                    required:
                      - status
                      - code
                      - message
